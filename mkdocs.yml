site_name: ETLrules
site_url: https://ciprianmiclaus2.github.io/etlrules/
repo_url: https://github.com/ciprianmiclaus2/etlrules
repo_name: etlrules
#strict: true
nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - API Reference:
      - api/index.md
      - Plans, rule engine and data: api/core.md
      - Custom rules: api/custom-rules.md
      - Exceptions: api/exceptions.md
      - Basic rules: api/basic.md
      - Aggregation rules: api/aggregate.md
      - Concatenation rules: api/concat.md
      - Conditional rules: api/conditions.md
      - Datetime rules: api/datetime.md
      - Fill rules: api/fill.md
      - Missing values rules: api/nulls.md
      - Join rules: api/joins.md
      - New column rules: api/newcolumns.md
      - Numeric rules: api/numeric.md
      - String rules: api/strings.md
      - Type conversion rules: api/types.md
      - Validation rules: api/validation.md
      - File rules: api/io-files.md
      - Database rules: api/io-db.md
  - Contributing: contributing.md
  - Authors: authors.md
  - History: history.md
extra_css:
  - stylesheets/extra.css
theme:
  name: material
  language: en
  #logo: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.tabs
    - navigation.instant
    - navigation.tabs.sticky
markdown_extensions:
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - admonition
  - toc:
      baselevel: 2
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - meta
plugins:
  - include-markdown
  - search:
      lang: en
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_bases: false
            separate_signature: true
            show_signature_annotations: true
            members_order: source
            filters: ["!^_"]
            heading_level: 2
watch:
  - etlrules
extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ciprianmiclaus2/etlrules
      name: Github
    - icon: material/email
      link: "mailto:ciprianm@gmail.com"
