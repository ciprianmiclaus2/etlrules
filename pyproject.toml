[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etlrules"
dynamic = ["version"]
description = "A python ETL rule engine operating with data frames."
authors = [{name = "Ciprian Miclaus", email = "ciprianm@gmail.com"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers=[
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Natural Language :: English',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]

dependencies = [
    "pandas>=2,<3",
    "pyyaml>=6.0.1",
    "pyarrow>=13.0.0",
    "sqlalchemy>=2.0.0"
]


[project.optional-dependencies]
polars = [
    "polars>=1,<1.32",
    "greenlet",  # polars.read_database imports sqlalchemy.ext.asyncio, which needs greenlet since SQLAlchemy 2.1
]

dask = [
    "aiohttp",
    "dask[dataframe]",
    "requests"
]

test = [
    "pytest",
    "black",
    "isort",
    "flake8",
    "flake8-docstrings",
    "pytest-cov"
    ]

dev = [
    "tox",
    "pre-commit",
    "virtualenv",
    "pip",
    "twine",
    "toml"
]

docs = [
    "mkdocs==1.5.3",
    "mkdocs-include-markdown-plugin==3.9.1",
    "mkdocs-material==8.1.11",
    "mkdocstrings==0.18.1",
    "mkdocs-material-extensions==1.3",
    "mkdocs-autorefs==0.3.1",
    "mike==1.1.2"
    ]


[project.urls]
homepage = "https://github.com/ciprianmiclaus2/etlrules"
documentation = "https://ciprianmiclaus2.github.io/etlrules/"
repository = "https://github.com/ciprianmiclaus2/etlrules"
history = "https://github.com/ciprianmiclaus2/etlrules/blob/main/HISTORY.md"

[project.scripts]
etlrules = "etlrules.runner:run"

[tool.setuptools.dynamic]
version = {attr = "etlrules.__version__"}

[tool.setuptools.packages.find]
include = ["etlrules", "etlrules.*"]
