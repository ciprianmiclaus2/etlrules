[tox]
isolated_build = true
envlist = py311, py312, py313, py314, lint

[gh-actions]
python =
    3.14: py314
    3.13: py313
    3.12: py312
    3.11: py311

[testenv:lint]
deps =
    build
extras =
    test
    docs
    dev
commands =
    isort etlrules
    black etlrules tests
    flake8 etlrules tests
    python -m build
    mkdocs build --strict
    twine check dist/*

[testenv]
extras =
    test
    polars
    dask
passenv = *
setenv =
    PYTHONPATH = {toxinidir}
    PYTHONWARNINGS = ignore
commands =
    pytest -s --cov=etlrules --cov-append --cov-report=xml --cov-report term-missing tests
