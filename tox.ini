[tox]
isolated_build = true
envlist = py311, py312, py313, py314, lint

[gh-actions]
python =
    3.14: py314
    3.13: py313
    3.12: py312
    3.11: py311

[testenv:lint]
allowlist_externals =
    isort
    black
    flake8
    poetry
    mkdocs
    twine
extras =
    test
    doc
    dev
commands =
    isort etlrules
    black etlrules tests
    flake8 etlrules tests
    poetry build
    mkdocs build
    twine check dist/*

[testenv]
allowlist_externals = pytest
extras =
    test
passenv = *
setenv =
    PYTHONPATH = {toxinidir}
    PYTHONWARNINGS = ignore
commands =
    pytest -s --cov=etlrules --cov-append --cov-report=xml --cov-report term-missing tests
