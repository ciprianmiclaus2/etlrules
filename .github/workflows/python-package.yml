# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  package:
    # Build the sdist/wheel and check the installed package (not the source tree) is complete.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        python -m twine check dist/*
    - name: Install the wheel in a clean venv and import every backend
      run: |
        python -m venv /tmp/wheel-venv
        /tmp/wheel-venv/bin/pip install "$(ls dist/*.whl)[polars,dask]"
        cd /tmp
        /tmp/wheel-venv/bin/python -c "
        import etlrules, etlrules.backends.pandas, etlrules.backends.polars, etlrules.backends.dask
        import etlrules.backends.pandas.io.db, etlrules.backends.polars.io.files, etlrules.backends.dask.io.files
        assert 'site-packages' in etlrules.__file__, etlrules.__file__
        print('etlrules', etlrules.__version__, 'from', etlrules.__file__)
        "
        /tmp/wheel-venv/bin/etlrules --help

  docs:
    # Check the documentation builds without warnings (it's published by the Documentation workflow on release).
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Build the docs
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[docs]"
        mkdocs build --strict

  minimum-versions:
    # Run the tests with the minimum versions declared in pyproject.toml (keep the two in sync),
    # on the oldest supported Python.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install the minimum versions
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[polars,dask,test]" \
          "pandas==2.2.2" "numpy<2" "pyarrow==14.0.1" "pyyaml==6.0.1" "sqlalchemy==2.0.0" \
          "polars==1.3.0" "dask[dataframe]==2025.5.0"
        python -m pip list
    - name: Test with pytest
      run: |
        pytest tests/

  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest pytest-cov
        python -m pip install .[dask,polars,test]
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest --cov=etlrules --cov-report=xml --cov-report term-missing tests/
    - name: Test with dask's pyarrow string conversion disabled
      # dask converts strings to pyarrow by default (dataframe.convert-string); users can disable it in their config
      if: matrix.python-version == '3.14'
      env:
        DASK_DATAFRAME__CONVERT_STRING: "False"
      run: |
        pytest tests/
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
