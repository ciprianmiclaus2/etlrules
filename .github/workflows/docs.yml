# Builds the documentation with mkdocs and publishes it to GitHub Pages (the gh-pages branch) with mike.
# Each minor version (e.g. 0.3) gets its own version of the docs; "latest" points to the most recent one.
#
# One-off setup: after the first run creates the gh-pages branch, enable GitHub Pages in the repository
# settings (Settings -> Pages -> Build and deployment -> Source: Deploy from a branch -> gh-pages / (root)).

name: Documentation

on:
  release:
    types: [published]
  # Allows publishing the docs manually from the Actions tab (pick the release tag in "Use workflow from").
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # mike needs the gh-pages branch
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[docs]"
    - name: Deploy the docs
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        VERSION=$(python -c "import etlrules; print('.'.join(etlrules.__version__.split('.')[:2]))")
        mike deploy --push --update-aliases "$VERSION" latest
        mike set-default --push latest
